name: monitor

on:
  schedule:
    - cron: "0 6 */3 * *"     # every 3 days, 06:00 UTC
  workflow_dispatch:           # manual trigger, for demos

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest scenes, score, and write alerts
        env:
          GDAL_DISABLE_READ_DIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
        run: python -m pipeline.monitor

      - name: Refresh the dashboard snapshot
        run: python -m pipeline.export_web

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          if git diff --staged --quiet; then
            echo "no new readings"
          else
            git commit -m "monitor: readings and alerts for $(date -u +%Y-%m-%d)"
            git push
          fi
