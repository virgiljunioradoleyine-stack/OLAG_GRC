name: probe-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe_results.json
