name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, pipeline
          bad = []
          for m in pkgutil.walk_packages(pipeline.__path__, "pipeline."):
              try:
                  importlib.import_module(m.name)
              except Exception as ex:
                  bad.append(f"{m.name}: {type(ex).__name__}: {ex}")
          if bad:
              raise SystemExit("import failures:\n  " + "\n  ".join(bad))
          print("all pipeline modules import cleanly")
          PY
      - name: Tests
        run: python -m pytest tests/ -q --tb=short

  model-contract:
    name: Model / feature compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Committed models must match the current feature contract
        run: |
          python - <<'PY'
          # This is the guard for the exact failure the audit found: pickles
          # fitted on 7 features while the code emitted 10, so every scoring
          # path raised and the scheduled job would have published nothing.
          import os, sys
          from pipeline.config import STATIONS
          from pipeline.features.builder import FEATURE_COLUMNS
          from pipeline.models.versioning import ModelIncompatible, bundle_path, load_bundle

          problems, found = [], 0
          for s in STATIONS:
              if not os.path.exists(bundle_path(s.id)):
                  continue
              found += 1
              try:
                  b = load_bundle(s.id, features=FEATURE_COLUMNS)
                  print(f"  {s.id}: OK  v{b.model_version} "
                        f"{len(b.features)} features trained to {b.training_end}")
              except ModelIncompatible as ex:
                  problems.append(str(ex))
          if problems:
              print("\nINCOMPATIBLE MODELS:")
              for p in problems: print("  " + p)
              sys.exit(1)
          print(f"\n{found} model bundle(s) checked")
          PY

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dashboard data must be valid JSON
        run: |
          node -e "
          const fs=require('fs'),p='public/data';
          if(!fs.existsSync(p)){console.log('no exported data yet — skipping');process.exit(0)}
          for(const f of fs.readdirSync(p)){
            const t=fs.readFileSync(p+'/'+f,'utf8');
            try{JSON.parse(t)}catch(e){console.error(f+': '+e.message);process.exit(1)}
            console.log('  '+f+': valid ('+(t.length/1024).toFixed(0)+' kB)');
          }"
