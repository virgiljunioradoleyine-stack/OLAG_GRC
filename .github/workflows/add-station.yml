name: add-station

# Adds a monitoring station picked on the Live Map.
#
# Two ways in, and they are not equal:
#
#   repository_dispatch — the Add button. The site validates the point and
#     dispatches this workflow directly. Nothing is opened, nothing is filed,
#     the user stays on the page and watches the station appear. This is the
#     path the button uses.
#
#   issues — the zero-configuration fallback, for a deployment that holds no
#     token at all. Opening a prefilled issue is a write the visitor's own
#     GitHub login authorises, so the feature still works with no secret
#     anywhere. Used only when the Add button reports it is unconfigured.
#
# Either way the request is untrusted input. add_station.py accepts a point
# only if the pipeline already published it as a verified candidate, so the
# worst outcome is a station on river the satellite record says is usable.

on:
  repository_dispatch:
    types: [add-station]
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  actions: write   # gh workflow run, to train a model for the new station

concurrency:
  group: add-station
  cancel-in-progress: false

jobs:
  add:
    if: >-
      github.event_name == 'repository_dispatch'
      || startsWith(github.event.issue.title, '[station]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Read the request
        id: req
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.issue.body }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          event = os.environ.get("EVENT", "")
          req = None
          if event == "repository_dispatch":
              # The site has already validated this against the published
              # candidates; it is re-validated below regardless.
              try:
                  req = json.loads(os.environ.get("PAYLOAD") or "{}")
              except Exception:
                  req = None
          else:
              # A fenced JSON block, so prose around it cannot alter the request.
              m = re.search(r"```json\s*(\{.*?\})\s*```",
                            os.environ.get("BODY") or "", re.S)
              if m:
                  try:
                      req = json.loads(m.group(1))
                  except Exception:
                      req = None

          try:
              lat, lon = float(req["lat"]), float(req["lon"])
          except Exception:
              print("ok=false")
              print("error=No readable station request. Use the Add button on "
                    "the Live Map.")
              sys.exit(0)

          role = req.get("role", "monitor")
          if role not in ("monitor", "control", "intake", "downstream"):
              role = "monitor"
          print("ok=true")
          print(f"lat={lat}")
          print(f"lon={lon}")
          print(f"name={str(req.get('name') or '').strip()[:60]}")
          print(f"role={role}")
          PY

      - name: Refuse an unreadable request
        if: steps.req.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.req.outputs.error }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "$MSG"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
            gh issue close "${{ github.event.issue.number }}"
          fi
          echo "::error::$MSG"
          exit 1

      - name: Validate the point and add it
        id: add
        continue-on-error: true
        run: |
          python -m scripts.add_station \
            --lat "${{ steps.req.outputs.lat }}" \
            --lon "${{ steps.req.outputs.lon }}" \
            --role "${{ steps.req.outputs.role }}" \
            ${{ steps.req.outputs.name && format('--name "{0}"', steps.req.outputs.name) || '' }} \
            > station.json 2> refusal.txt
          cat station.json refusal.txt

      - name: Report a refusal
        if: steps.add.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "$(cat refusal.txt)"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
            gh issue close "${{ github.event.issue.number }}"
          fi
          cat refusal.txt
          echo "::error::$(head -1 refusal.txt)"
          exit 1

      - name: Collect the new station's history
        run: |
          # The whole archive for this station only; every other station's
          # stored rows are untouched because they collected nothing this run.
          python -m pipeline.satellite.observations 2017-01-01

      - name: Refresh the candidate sites
        run: |
          # BEFORE validation, not after. Adding a station at a candidate site
          # turns that candidate into a duplicate of it by definition, and a
          # test asserts no candidate sits on top of a station. Validating
          # first therefore fails on a state this run has not finished
          # updating -- which is exactly what happened on the first real
          # request: the station was added and collected, then the run died on
          # its own half-applied change and committed nothing.
          python -m pipeline.satellite.candidates

      - name: Validate everything before publishing it
        run: python -m pytest tests/ -q

      - name: Export the dashboard
        run: python -m pipeline.export.dashboard

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          ID=$(python -c "import json;print(json.load(open('station.json'))['id'])")
          git commit -m "network: add station $ID from the Live Map"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Train a model for it
        id: train
        # The station is already committed by this point. A model can be
        # trained later -- the monthly run will pick it up -- so failing to
        # dispatch must not report the whole addition as failed, which is what
        # happened on the first successful add: P09 was on the network and the
        # run showed red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run train.yml --ref "${GITHUB_REF_NAME}"

      - name: Note that training was not dispatched
        if: steps.train.outcome == 'failure'
        run: |
          echo "::warning::The station was added and committed, but training "\
               "could not be dispatched. It will be trained by the next "\
               "scheduled run; until then the station shows readings but no "\
               "expected-condition baseline and raises no alerts."

      - name: Say what happened
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > comment.md
          import json
          r = json.load(open("station.json"))
          src = r.get("source", {})
          print(f"**{r['id']} — {r['name']} is on the network.**\n")
          print(f"- `{r['lat']:.6f}, {r['lon']:.6f}`, tile `{src.get('tile')}`")
          print(f"- {src.get('water_pixels')} usable water pixels")
          print(f"- position **{r['order']} of {r['network_size']}** in the chain")
          PY
          gh issue comment "${{ github.event.issue.number }}" \
            --body "$(cat comment.md)"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue close "${{ github.event.issue.number }}"
