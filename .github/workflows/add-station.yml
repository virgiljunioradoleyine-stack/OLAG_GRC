name: add-station

# Runs when someone clicks a site on the Live Map and confirms it. The click
# opens a prefilled issue; opening that issue is the trigger. GitHub's own
# login is what authorises the write, which is why this needs no token, no
# secret and no third-party auth service anywhere in the stack.
#
# The issue body is public input and is not trusted. add_station.py accepts a
# point only if the pipeline already published it as a verified candidate, so
# the worst a stranger can do is add a station the satellite record says is
# usable river.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-station
  cancel-in-progress: false

jobs:
  add:
    # Only issues the map created. The title is set by the map's link.
    if: startsWith(github.event.issue.title, '[station]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Read the request
        id: req
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          # The body carries a fenced JSON block written by the map. Parsing
          # only that block means prose around it cannot change the request.
          import json, os, re, sys
          body = os.environ.get("BODY") or ""
          m = re.search(r"```json\s*(\{.*?\})\s*```", body, re.S)
          if not m:
              print("ok=false")
              print("error=The issue does not contain a station request block. "
                    "Use the Add button on the Live Map rather than writing the "
                    "issue by hand.")
              sys.exit(0)
          try:
              req = json.loads(m.group(1))
              lat, lon = float(req["lat"]), float(req["lon"])
          except Exception as ex:
              print("ok=false")
              print(f"error=The request block could not be read ({ex}).")
              sys.exit(0)
          name = str(req.get("name") or "").strip()[:60]
          role = req.get("role", "monitor")
          if role not in ("monitor", "control", "intake", "downstream"):
              role = "monitor"
          print("ok=true")
          print(f"lat={lat}")
          print(f"lon={lon}")
          print(f"name={name}")
          print(f"role={role}")
          PY

      - name: Refuse an unreadable request
        if: steps.req.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.req.outputs.error }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "$MSG"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue close "${{ github.event.issue.number }}"
          exit 1

      - name: Validate the point and add it
        id: add
        continue-on-error: true
        run: |
          python -m scripts.add_station \
            --lat "${{ steps.req.outputs.lat }}" \
            --lon "${{ steps.req.outputs.lon }}" \
            --role "${{ steps.req.outputs.role }}" \
            ${{ steps.req.outputs.name && format('--name "{0}"', steps.req.outputs.name) || '' }} \
            > station.json 2> refusal.txt
          cat station.json refusal.txt

      - name: Report a refusal
        if: steps.add.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "$(cat refusal.txt)"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue close "${{ github.event.issue.number }}"
          exit 1

      - name: Collect the new station's history
        run: |
          # The whole archive for this station only; every other station's
          # stored rows are untouched because they collected nothing this run.
          python -m pipeline.satellite.observations 2017-01-01

      - name: Refresh the candidate sites
        run: |
          # BEFORE validation, not after. Adding a station at a candidate site
          # turns that candidate into a duplicate of it by definition, and a
          # test asserts no candidate sits on top of a station. Validating
          # first therefore fails on a state this run has not finished
          # updating -- which is exactly what happened on the first real
          # request: the station was added and collected, then the run died on
          # its own half-applied change and committed nothing.
          python -m pipeline.satellite.candidates

      - name: Validate everything before publishing it
        run: python -m pytest tests/ -q

      - name: Export the dashboard
        run: python -m pipeline.export.dashboard

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          ID=$(python -c "import json;print(json.load(open('station.json'))['id'])")
          git commit -m "network: add station $ID from the Live Map

          Closes #${{ github.event.issue.number }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Train a model for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run train.yml --ref "${GITHUB_REF_NAME}"

      - name: Say what happened
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > comment.md
          import json
          r = json.load(open("station.json"))
          src = r.get("source", {})
          print(f"**{r['id']} — {r['name']} is on the network.**\n")
          print(f"- Position `{r['lat']:.6f}, {r['lon']:.6f}`, tile "
                f"`{src.get('tile')}`, snapped {src.get('snapped_m')} m from "
                f"the click")
          print(f"- {src.get('water_pixels')} usable water pixels in the "
                f"reading window")
          print(f"- Sits at position **{r['order']} of {r['network_size']}** "
                f"in the chain, so the stations below it were renumbered and "
                f"their upstream neighbour is now this one")
          print(f"\nIts full Sentinel-2 history has been collected and the "
                f"dashboard is rebuilt. A model is training now; until that "
                f"finishes the station shows readings but no expected-condition "
                f"baseline, so it raises no alerts yet.")
          PY
          gh issue comment "${{ github.event.issue.number }}" \
            --body "$(cat comment.md)"$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue close "${{ github.event.issue.number }}"
